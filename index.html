
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SNIPER AI ADAPTIVE V5</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:10px;
}

h2{margin:10px}

button{
  padding:10px;
  margin:5px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}

.green{color:#22c55e}
.red{color:#ef4444}
.yellow{color:#facc15}
.blue{color:#38bdf8}
</style>
</head>

<body>

<h2>🚀 SNIPER AI ADAPTIVE v5 (REAL BINANCE)</h2>

<div class="container">

<!-- ================= CHART ================= -->
<div class="card">
  <div id="chart"></div>
</div>

<!-- ================= PANEL ================= -->
<div class="card">

<h3>🤖 BOT STATUS</h3>
<div id="botStatus" class="yellow">OFF</div>

<h3>💰 BALANCE</h3>
<div id="balance">Loading...</div>

<h3>📈 PRICE</h3>
<div id="price">Loading...</div>

<h3>🧠 MARKET MODE</h3>
<div id="market">-</div>

<h3>⚡ SIGNAL</h3>
<div id="signal">WAIT...</div>

<h3>📊 HISTORY</h3>
<div id="stats">Loading...</div>

<hr>

<button onclick="startBot()">▶ START BOT</button>
<button onclick="stopBot()">⛔ STOP BOT</button>

</div>

</div>

<script>

// ================= CHART =================
new TradingView.widget({
  container_id: "chart",
  symbol: "BINANCE:TONUSDT",
  interval: "5",
  theme: "dark",
  style: "1",
  width: "100%",
  height: 500
});

// ================= BALANCE =================
async function loadBalance(){
  try{
    let res = await fetch("/balance");
    let data = await res.json();

    document.getElementById("balance").innerHTML =
      `USDT: ${Number(data.USDT).toFixed(2)}<br>
       TON: ${Number(data.TON).toFixed(4)}`;
  }catch(e){
    document.getElementById("balance").innerHTML = "ERROR";
  }
}

// ================= PRICE =================
async function loadPrice(){
  try{
    let res = await fetch("/price");
    let data = await res.json();

    document.getElementById("price").innerHTML =
      `<b>${Number(data.price).toFixed(6)}</b>`;
  }catch(e){
    document.getElementById("price").innerHTML = "ERROR";
  }
}

// ================= SIGNAL =================
async function loadSignal(){
  try{
    let res = await fetch("/signal");
    let data = await res.json();

    let color = "yellow";
    if(data.signal == "BUY") color = "green";
    if(data.signal == "SELL") color = "red";

    document.getElementById("signal").innerHTML =
      `<span class="${color}">${data.signal}</span>`;

    document.getElementById("market").innerHTML =
      `<span class="blue">${data.market}</span>`;

  }catch(e){
    document.getElementById("signal").innerHTML = "ERROR";
  }
}

// ================= STATS =================
async function loadStats(){
  try{
    let res = await fetch("/stats");
    let data = await res.json();

    document.getElementById("stats").innerHTML =
      `TRADES: ${data.trades}<br>
       WINS: ${data.wins}<br>
       LOSSES: ${data.losses}<br>
       WINRATE: ${data.winrate}%<br>
       PROFIT: ${data.profit}`;
  }catch(e){
    document.getElementById("stats").innerHTML = "ERROR";
  }
}

// ================= BOT CONTROL =================
function startBot(){
  fetch("/start_bot")
    .then(res=>res.json())
    .then(()=>{
      document.getElementById("botStatus").innerHTML = "ON";
      document.getElementById("botStatus").className = "green";
    });
}

function stopBot(){
  fetch("/stop_bot")
    .then(res=>res.json())
    .then(()=>{
      document.getElementById("botStatus").innerHTML = "OFF";
      document.getElementById("botStatus").className = "red";
    });
}

// ================= AUTO REFRESH =================
setInterval(()=>{
  loadBalance();
  loadPrice();
  loadSignal();
  loadStats();
}, 3000);

// INIT
loadBalance();
loadPrice();
loadSignal();
loadStats();

</script>

</body>
</html>
