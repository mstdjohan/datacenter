
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Investor Login</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#111827;
  padding:30px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:5px;
  border:none;
}

button{
  width:100%;
  padding:10px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 Investor Login</h2>

<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

</div>

</body>
</html>
